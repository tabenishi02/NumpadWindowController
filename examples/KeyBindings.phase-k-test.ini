[General]
ConfigVersion=3
DefaultLayer=Window
LayerOrder=Window,Edit,Media,Tools
EnableVirtual00=Off
EnableVirtual000=On

; Phase K physical acceptance test configuration.
; NumpadAdd is the global Layer Next key.
; Backspace is intentionally unmapped so native pass-through can be verified.

[GlobalKeys]
NumpadAdd=LayerNext

[Layer-Window]
NumpadDiv=ManualWindow1
NumpadMult=ManualWindow2
NumpadSub=ManualWindow3
Numpad7=Chrome1
Numpad8=Chrome2
Numpad9=Chrome3
Numpad4=VSCode1
Numpad5=VSCode2
Numpad6=VSCode3
Numpad1=Explorer
Numpad2=ChatGPT
Numpad3=PowerShell7
Numpad0=ZeroWindow
Virtual000=TripleZeroWindow
NumpadDot=ManualWindowDot
NumpadEnter=ManualWindowEnter

[Layer-Edit]
Numpad7=Undo
Numpad8=Copy
Numpad9=Paste
Numpad4=Cut
Numpad5=SelectAll
Numpad6=Save
Numpad1=Find
Numpad2=Screenshot
Numpad3=Redo

[Layer-Media]
Numpad7=MediaPrev
Numpad8=MediaPlayPause
Numpad9=MediaNext
Numpad4=VolumeDown
Numpad5=VolumeMute
Numpad6=VolumeUp
Numpad1=BrowserBack
Numpad2=BrowserRefresh
Numpad3=BrowserForward
Numpad0=Screenshot

[Layer-Tools]
NumpadDiv=RunNotepad
NumpadMult=NotepadActivate
NumpadSub=ManualTools
Numpad7=Copy
Numpad8=Paste
Numpad9=CopyToNotepad
Numpad4=Screenshot
Numpad5=MediaPlayPause
Numpad6=VolumeMute
Numpad1=ManualTools1
Numpad2=ManualTools2
Numpad3=ManualTools3
Numpad0=ZeroWindow
Virtual000=TripleZeroWindow
NumpadDot=ManualToolsDot
NumpadEnter=ManualToolsEnter

