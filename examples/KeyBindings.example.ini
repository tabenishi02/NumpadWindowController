[General]
ConfigVersion=3
DefaultLayer=Base
LayerOrder=Base,Tools
EnableVirtual00=On
EnableVirtual000=On

[GlobalKeys]
NumpadAdd=LayerNext

[Layer-Base]
NumpadDiv=RunNotepad
NumpadMult=NotepadActivate
NumpadSub=ManualWindow
Numpad7=Copy
Numpad8=Paste
Numpad9=CopyToNotepad
Numpad0=ManualWindow
Virtual00=Copy
Virtual000=Paste
NumpadEnter=ManualWindow

[Layer-Tools]
Numpad7=Screenshot
Numpad8=PlayPause
Numpad9=VolumeMute
Numpad4=BrowserBack
Numpad5=BrowserRefresh
Numpad6=BrowserForward

[WindowGroup-Notepad]
MatchProcess=notepad.exe
MatchClass=
MatchTitleContains=
LaunchTarget=C:\Windows\System32\notepad.exe
LaunchArguments=
LaunchWorkingDirectory=
LaunchPendingTimeoutMs=5000

[Action-LayerNext]
Type=LayerSwitch
Label=Next Layer
Mode=Next
Layer=

[Action-RunNotepad]
Type=Run
Label=Run Notepad
Target=C:\Windows\System32\notepad.exe
Arguments=
WorkingDirectory=

[Action-NotepadActivate]
Type=Window
Label=Notepad
Behavior=Activate
WindowGroup=Notepad
AllowedProcess=notepad.exe
AllowedClass=
AllowedTitleContains=
AutoBindStrategy=FirstMatch
AutoBindOrder=1

[Action-ManualWindow]
Type=Window
Label=Manual Window
Behavior=Toggle
WindowGroup=
AllowedProcess=
AllowedClass=
AllowedTitleContains=
AutoBindStrategy=None
AutoBindOrder=1

[Action-Copy]
Type=KeySend
Label=Copy
Keys=Ctrl+C

[Action-Paste]
Type=KeySend
Label=Paste
Keys=Ctrl+V

[Action-Screenshot]
Type=KeySend
Label=Screenshot
Keys=Win+Shift+S

[Action-PlayPause]
Type=KeySend
Label=Play Pause
Keys=Media_Play_Pause

[Action-VolumeMute]
Type=KeySend
Label=Volume Mute
Keys=Volume_Mute

[Action-BrowserBack]
Type=KeySend
Label=Browser Back
Keys=Browser_Back

[Action-BrowserRefresh]
Type=KeySend
Label=Browser Refresh
Keys=Browser_Refresh

[Action-BrowserForward]
Type=KeySend
Label=Browser Forward
Keys=Browser_Forward

[Action-Delay100]
Type=Delay
Label=100 ms
Milliseconds=100

[Action-CopyToNotepad]
Type=MultiAction
Label=Copy to Notepad
Step1=Copy
Step2=Delay100
Step3=NotepadActivate
Step4=Paste
