[General]
ConfigVersion=3
DefaultLayer=Base
LayerOrder=Base,Edit,Media
EnableVirtual00=Off
EnableVirtual000=Off

; NumpadAdd is a layer-independent Layer Next key.
; Unmapped keys pass through to Windows. Backspace is intentionally unmapped.

[GlobalKeys]
NumpadAdd=LayerNext

[Layer-Base]
NumpadDiv=WindowDiv
NumpadMult=WindowMult
NumpadSub=WindowSub
Numpad7=Window7
Numpad8=Window8
Numpad9=Window9
Numpad4=Window4
Numpad5=Window5
Numpad6=Window6
Numpad1=Window1
Numpad2=Window2
Numpad3=Window3
Numpad0=Window0
NumpadDot=WindowDot
NumpadEnter=WindowEnter

[Layer-Edit]
Numpad7=Undo
Numpad8=Copy
Numpad9=Paste
Numpad4=Cut
Numpad5=SelectAll
Numpad6=Save
Numpad1=Find
Numpad2=Screenshot
Numpad3=Redo

[Layer-Media]
Numpad7=MediaPrev
Numpad8=MediaPlayPause
Numpad9=MediaNext
Numpad4=VolumeDown
Numpad5=VolumeMute
Numpad6=VolumeUp
Numpad1=BrowserBack
Numpad2=BrowserRefresh
Numpad3=BrowserForward
Numpad0=Screenshot

