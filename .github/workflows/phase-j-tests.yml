name: AutoHotkey Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  controller-regression:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install AutoHotkey v2
        shell: powershell
        run: choco install autohotkey --version=2.0.28 -y --no-progress

      - name: Run Phase K controller regression
        shell: powershell
        run: .\tests\Run-PhaseKTests.ps1

      - name: Run startup preview tests
        shell: powershell
        run: .\tests\StartupTask.Tests.ps1

      - name: Run startup integration tests
        shell: powershell
        run: .\tests\StartupTask.Tests.ps1 -Integration
